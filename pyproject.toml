[project]
name = "cell-classifier"
version = "0.1.0"
description = ""
authors = [
    {name = "joacocibeira",email = "cibeira.joaquin@gmail.com"}
]
readme = "README.md"
packages = [{ include = "cell_classifier", from = "src" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch (==2.8.0)",
    "onnx (==1.19.0)",
    "onnxruntime-gpu (==1.23.0)",
    "roboflow (==1.2.9)",
    "torchvision (==0.23.0)",
    "ultralytics (==8.3.203)",
    "pillow (>=11.3.0,<12.0.0)",
    "pandas (>=2.3.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.30.1"

